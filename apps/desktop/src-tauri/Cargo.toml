[package]
name = "sealpad"
version = "0.1.0"
description = "印台 SealPad：离线、开源的 PDF 盖章与签名工具"
authors = ["SealPad contributors"]
license = "Apache-2.0"
repository = "https://github.com/jiangcuo/sealpad"
edition = "2021"
rust-version = "1.77.2"

[lib]
name = "sealpad_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
strip = true
