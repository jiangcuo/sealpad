name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: 核心库、网页版与端到端测试
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          # 仓库暂未提交 pnpm-lock.yaml，关闭 setup-node v5 默认开启的依赖缓存
          package-manager-cache: false
      - name: 安装依赖
        run: pnpm install --no-frozen-lockfile
      - name: 类型检查
        run: pnpm typecheck
      - name: 单元测试
        run: pnpm test
      - name: 构建网页版
        run: pnpm build
      - name: 安装 Playwright 浏览器
        run: pnpm --filter @sealpad/web exec playwright install --with-deps chromium
      - name: 端到端测试
        run: pnpm e2e
      - name: 上传测试结果
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: e2e-results
          path: |
            apps/web/test-results
            apps/web/playwright-report
          if-no-files-found: ignore
          retention-days: 14

  desktop:
    name: 桌面版编译检查
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - name: 安装 Tauri 系统依赖
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri -> target
      - name: 准备前端产物占位
        # generate_context! 编译时需要 frontendDist 目录存在；这里只检查 Rust 代码
        run: mkdir -p apps/web/dist && echo '<!doctype html><title>SealPad</title>' > apps/web/dist/index.html
      - name: cargo clippy
        run: cargo clippy --manifest-path apps/desktop/src-tauri/Cargo.toml --all-targets -- -D warnings
